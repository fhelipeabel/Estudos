<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
</head>
<body>

    <div class="container">

        <div class="left-col">
            <div class="content">
                <h1>Bem-vindo!</h1>
                <p>Faça login para acessar nosso casamento!</p>
                <div class="form">
                    <div class="outfield">
                        <label for="user">Usuário</label><br>
                        <input class="input-field" type="text" id="user" name="user" placeholder="Digite seu usuário" autocomplete="off">
                    </div>
                    <div class="outfield">
                        <label for="password">Senha</label><br>
                        <input class="input-field" type="password" id="password" name="password" placeholder="Digite sua senha">
                    </div>
                    <div class="small">
                        <div>
                            <input id="accept" name="accept" type="checkbox" class="checkbox">
                            <label for="accept" class="accept">Lembrar senha</label>
                        </div>
                        <a href="" class="small-link">Recuperar acesso</a>
                    </div>
                        <div class="button-acessar-div"><button class="acessar">Acessar</button></div>
                    <div class="final-info">
                        <p class="small-link">Entre também com</p>
                        <div class="iconsdiv">
                            <img class="icon" src="facebook.png" alt="facebook icon">
                            <img class="icon" src="google.png" alt="google icon">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-col">
            <img class="img-login" src="img-login.jpg" alt  ="Mão de um homem encontrando e pegando na mão de uma mulher, simbolizando a conexão entre noivos. Fundo desfoc ado de floresta">
        </div>

    </div>

</body>
</html>
